name: Repo work
about: Track concrete Agent OS repo work
labels: [repo]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: area
    attributes:
      label: Area / files
      description: Which docs, templates, agents, workflows, or adapters are affected?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true when this is done?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety / privacy notes
      description: Any publication, security, or private-context concerns?
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should this be checked?
