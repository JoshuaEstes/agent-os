<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent OS council to expert workflow</title>
  <desc id="desc">The overseer uses council advisors to stress-test a decision, then routes scoped tasks to expert agents.</desc>
  <defs>
    <style>
      .bg{fill:#07111f}.box{fill:#111827;stroke:#22d3ee;stroke-width:3;rx:20}.adv{fill:#1e1b4b;stroke:#a78bfa;stroke-width:2;rx:18}.task{fill:#064e3b;stroke:#34d399;stroke-width:2;rx:18}.text{fill:#f8fafc;font:700 30px system-ui}.small{fill:#cbd5e1;font:500 22px system-ui}.tiny{fill:#94a3b8;font:500 18px system-ui}.line{stroke:#22d3ee;stroke-width:4;fill:none;marker-end:url(#arrow)}.green{stroke:#34d399;stroke-width:4;fill:none;marker-end:url(#arrowg)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#22d3ee"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34d399"/></marker>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text class="text" x="700" y="65" text-anchor="middle">Council → Expert Workflow</text>
  <rect class="box" x="90" y="160" width="250" height="120"/>
  <text class="small" x="215" y="210" text-anchor="middle">Decision brief</text>
  <text class="tiny" x="215" y="242" text-anchor="middle">question + constraints</text>
  <rect class="box" x="520" y="140" width="360" height="150"/>
  <text class="text" x="700" y="205" text-anchor="middle">Overseer</text>
  <text class="small" x="700" y="245" text-anchor="middle">routes to council</text>
  <path class="line" d="M340 220 C420 220 455 215 520 215"/>
  <rect class="adv" x="120" y="440" width="190" height="90"/>
  <text class="small" x="215" y="492" text-anchor="middle">Strategy</text>
  <rect class="adv" x="360" y="440" width="190" height="90"/>
  <text class="small" x="455" y="492" text-anchor="middle">Skeptic</text>
  <rect class="adv" x="600" y="440" width="190" height="90"/>
  <text class="small" x="695" y="492" text-anchor="middle">Customer</text>
  <rect class="adv" x="840" y="440" width="190" height="90"/>
  <text class="small" x="935" y="492" text-anchor="middle">Operator</text>
  <rect class="adv" x="1080" y="440" width="190" height="90"/>
  <text class="small" x="1175" y="492" text-anchor="middle">Risk</text>
  <path class="line" d="M650 290 C520 360 330 365 215 440"/>
  <path class="line" d="M680 290 C600 360 520 370 455 440"/>
  <path class="line" d="M700 290 C700 350 698 385 695 440"/>
  <path class="line" d="M725 290 C800 360 885 370 935 440"/>
  <path class="line" d="M755 290 C900 355 1080 365 1175 440"/>
  <rect class="box" x="520" y="610" width="360" height="115"/>
  <text class="small" x="700" y="655" text-anchor="middle">Synthesis</text>
  <text class="tiny" x="700" y="686" text-anchor="middle">disagreements + recommendation</text>
  <path class="line" d="M215 530 C300 590 430 630 520 655"/>
  <path class="line" d="M455 530 C480 585 505 615 540 640"/>
  <path class="line" d="M695 530 L695 610"/>
  <path class="line" d="M935 530 C900 585 875 615 840 640"/>
  <path class="line" d="M1175 530 C1050 590 965 630 880 655"/>
  <rect class="task" x="185" y="790" width="260" height="80"/>
  <text class="small" x="315" y="838" text-anchor="middle">Expert task</text>
  <rect class="task" x="570" y="790" width="260" height="80"/>
  <text class="small" x="700" y="838" text-anchor="middle">Expert task</text>
  <rect class="task" x="955" y="790" width="260" height="80"/>
  <text class="small" x="1085" y="838" text-anchor="middle">Expert task</text>
  <path class="green" d="M610 725 C520 760 420 770 315 790"/>
  <path class="green" d="M700 725 L700 790"/>
  <path class="green" d="M790 725 C880 760 990 770 1085 790"/>
</svg>
